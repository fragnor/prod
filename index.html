<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Planta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .main-container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    #app-content { display: none; }
    .nav-tabs { border-bottom: 2px solid #dee2e6; margin-bottom: 20px; }
    .nav-link { font-weight: bold; color: #6c757d; }
    .nav-link.active { color: #0d6efd !important; border-bottom: 3px solid #0d6efd !important; border: none; }
    .form-label { font-weight: 600; font-size: 0.85rem; color: #495057; }
    .section-title { border-left: 4px solid #0d6efd; padding-left: 10px; margin-bottom: 20px; font-weight: bold; }
  </style>
</head>
<body>

<div class="main-container">
  <div id="login-section">
    <div class="text-center mb-4">
      <h3>Acceso Operarios</h3>
      <p class="text-muted">Introduce tus credenciales para comenzar</p>
    </div>
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" id="user" class="form-control form-control-lg">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" id="pass" class="form-control form-control-lg">
    </div>
    <button class="btn btn-primary btn-lg w-100" onclick="handleLogin()" id="loginBtn">Entrar al Sistema</button>
  </div>

  <div id="app-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <span id="userTag" class="badge bg-primary fs-6 p-2"></span>
      <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">Cerrar Sesión</button>
    </div>

    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="prod-tab" data-bs-toggle="tab" data-bs-target="#prod-panel" type="button" onclick="checkDataLoss(event)">Producción</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="averia-tab" data-bs-toggle="tab" data-bs-target="#averia-panel" type="button" onclick="checkDataLoss(event)">Averías</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="prod-panel">
        <form id="formProd">
          <input type="hidden" id="rowId">
          <div class="row g-3">
            <div class="col-4 col-md-2"><label class="form-label">Día</label><input type="number" id="dia" class="form-control" onchange="markDirty()"></div>
            <div class="col-4 col-md-2"><label class="form-label">Mes</label><input type="number" id="mes" class="form-control" onchange="markDirty()"></div>
            <div class="col-4 col-md-2"><label class="form-label">Horas Trab.</label><input type="number" step="0.1" id="horas" class="form-control" placeholder="Ej: 8" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label">Turno</label><select id="turno" class="form-select" onchange="markDirty()"></select></div>
            <div class="col-6 col-md-3"><label class="form-label">Prensa</label><select id="prensa" class="form-select" onchange="markDirty()"></select></div>
            
            <div class="col-md-6"><label class="form-label">Referencia</label><select id="referencia" class="form-select" onchange="markDirty()"></select></div>
            <div class="col-md-6"><label class="form-label">Material</label><select id="material" class="form-select" onchange="markDirty()"></select></div>
            
            <div class="col-12"><label class="form-label">Lote Bobina</label><input type="text" id="lote" class="form-control" onchange="markDirty()"></div>
            
            <div class="col-6 col-md-3"><label class="form-label text-primary">Piezas Totales</label><input type="number" id="total" class="form-control border-primary" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label text-success">Buenas</label><input type="number" id="buenas" class="form-control" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label text-warning">A Revisar</label><input type="number" id="revisar" class="form-control" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label text-danger">Malas</label><input type="number" id="malas" class="form-control" onchange="markDirty()"></div>

            <div class="col-12"><label class="form-label">Observaciones</label><textarea id="obs" class="form-control" rows="1" onchange="markDirty()"></textarea></div>
            
            <div class="col-12 mt-4">
              <button type="button" class="btn btn-success btn-lg w-100 shadow-sm" onclick="saveProduccion()">GRABAR PRODUCCIÓN</button>
            </div>
          </div>
        </form>

        <div class="mt-5">
          <h6 class="text-muted">Mis últimos registros</h6>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <tbody id="listaData" style="font-size: 0.9rem;"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="averia-panel">
        <h5 class="section-title">Registro de Avería / Incidencia</h5>
        <form id="formAveria">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nº de Máquina</label>
              <select id="av-maquina" class="form-select" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Tipo de Avería</label>
              <select id="av-tipo" class="form-select" required></select>
            </div>
            <div class="col-6 col-md-6">
              <label class="form-label">Hora de Paro</label>
              <input type="time" id="av-paro" class="form-control" required>
            </div>
            <div class="col-6 col-md-6">
              <label class="form-label">Hora de Arranque</label>
              <input type="time" id="av-arranque" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Observaciones</label>
              <textarea id="av-obs" class="form-control" rows="3" placeholder="Detalla qué ha pasado..."></textarea>
            </div>
            <div class="col-12 mt-4">
              <button type="button" class="btn btn-warning btn-lg w-100" onclick="saveAveria()">REGISTRAR AVERÍA</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ==========================================
  // CONFIGURACIÓN: COPIA TU URL AQUÍ
  // ==========================================
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzP3rv0NBTm9Gho7BE3P-nwR5SjcxHdE6SV6hTuF_89y-tmxwTR1wDsx8BMxabJlHsxkg/exec"; 
  
  let currentOperario = "";
  let isDirty = false;

  function markDirty() { isDirty = true; }

  // Alerta de pérdida de datos
  function checkDataLoss(e) {
    if (isDirty) {
      if (!confirm("Atención: Tienes datos escritos en el formulario de producción que no has guardado. ¿Quieres cambiar de pestaña de todas formas?")) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      isDirty = false;
    }
  }

  async function callAPI(action, data = {}) {
    try {
      const response = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...data })
      });
      return await response.json();
    } catch (e) {
      console.error(e);
      alert("Error de conexión con el servidor.");
      return null;
    }
  }

  async function handleLogin() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    const btn = document.getElementById("loginBtn");

    if(!u || !p) return alert("Escribe usuario y contraseña");
    
    btn.disabled = true; btn.innerText = "Verificando...";

    const res = await callAPI("login", { usuario: u, password: p });
    if (res && res.success) {
      currentOperario = res.user;
      document.getElementById("login-section").style.display = "none";
      document.getElementById("app-content").style.display = "block";
      document.getElementById("userTag").innerText = "👤 " + currentOperario;
      
      // CARGAR FECHA ACTUAL AUTOMÁTICAMENTE
      const hoy = new Date();
      document.getElementById("dia").value = hoy.getDate();
      document.getElementById("mes").value = hoy.getMonth() + 1;

      loadConfig();
      loadHistory();
    } else {
      alert("Usuario o contraseña incorrectos");
      btn.disabled = false; btn.innerText = "Entrar al Sistema";
    }
  }

  async function loadConfig() {
    const cfg = await callAPI("getConfig");
    if(cfg) {
      fillSelect("turno", cfg.turnos);
      fillSelect("prensa", cfg.prensas);
      fillSelect("av-maquina", cfg.prensas);
      fillSelect("referencia", cfg.referencias);
      fillSelect("material", cfg.materiales);
      fillSelect("av-tipo", cfg.averias);
    }
  }

  function fillSelect(id, list) {
    const s = document.getElementById(id);
    s.innerHTML = '<option value="">Seleccionar...</option>';
    list.forEach(i => s.add(new Option(i, i)));
  }

  async function saveProduccion() {
    const t = parseInt(document.getElementById("total").value) || 0;
    const b = parseInt(document.getElementById("buenas").value) || 0;
    const r = parseInt(document.getElementById("revisar").value) || 0;
    const m = parseInt(document.getElementById("malas").value) || 0;

    if (t !== (b + r + m)) {
      alert(`⚠️ ERROR DE SUMA:\nEl Total (${t}) debe ser igual a la suma de Buenas+Revisar+Malas (${b+r+m}).\n\nPor favor, corrige las cantidades.`);
      return;
    }

    const registro = {
      id: document.getElementById("rowId").value,
      operario: currentOperario,
      dia: document.getElementById("dia").value, 
      mes: document.getElementById("mes").value,
      horas: document.getElementById("horas").value,
      turno: document.getElementById("turno").value, 
      prensa: document.getElementById("prensa").value,
      referencia: document.getElementById("referencia").value, 
      material: document.getElementById("material").value,
      lote: document.getElementById("lote").value, 
      total: t, buenas: b, revisar: r, malas: m,
      observaciones: document.getElementById("obs").value
    };

    const res = await callAPI("save", { registro });
    if (res && res.success) {
      alert(res.message);
      document.getElementById("formProd").reset();
      document.getElementById("rowId").value = "";
      // Resetear fecha tras limpiar formulario
      const hoy = new Date();
      document.getElementById("dia").value = hoy.getDate();
      document.getElementById("mes").value = hoy.getMonth() + 1;
      isDirty = false;
      loadHistory();
    }
  }

  async function saveAveria() {
    const registro = {
      operario: currentOperario,
      maquina: document.getElementById("av-maquina").value,
      tipo: document.getElementById("av-tipo").value,
      paro: document.getElementById("av-paro").value,
      arranque: document.getElementById("av-arranque").value,
      observaciones: document.getElementById("av-obs").value
    };

    if (!registro.maquina || !registro.tipo || !registro.paro) {
      alert("Por favor, indica al menos la máquina, el tipo de avería y la hora de paro.");
      return;
    }

    const res = await callAPI("saveAveria", { registro });
    if (res && res.success) {
      alert(res.message);
      document.getElementById("formAveria").reset();
    }
  }

  async function loadHistory() {
    const data = await callAPI("getRecords", { operario: currentOperario });
    if(data) {
      const tbody = document.getElementById("listaData");
      tbody.innerHTML = "";
      data.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${r.dia}/${r.mes}</strong></td>
            <td>${r.referencia}</td>
            <td class="text-end text-primary fw-bold">${r.total} u.</td>
          </tr>`;
      });
    }
  }
</script>
</body>
</html>
