<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Producción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; font-family: sans-serif; padding: 20px; }
    .card-app { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    #app-content { display: none; }
    .btn-save { background-color: #28a745; color: white; border: none; font-weight: bold; }
    .btn-save:hover { background-color: #218838; color: white; }
    .historial-container { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
  </style>
</head>
<body>

<div class="card-app">
  <div id="login-section">
    <h3 class="text-center mb-4">Acceso Producción</h3>
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" id="user" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" id="pass" class="form-control">
    </div>
    <button class="btn btn-primary w-100" id="loginBtn" onclick="handleLogin()">Iniciar Sesión</button>
    <div id="errMsg" class="text-danger mt-3 text-center" style="display:none;">Error de usuario o conexión</div>
  </div>

  <div id="app-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 id="userTag" class="text-primary m-0"></h4>
      <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">Cerrar Sesión</button>
    </div>

    <form id="formProduccion">
      <input type="hidden" id="rowId">
      <div class="row g-3">
        <div class="col-6 col-md-3"><label>Día</label><input type="number" id="dia" class="form-control" required></div>
        <div class="col-6 col-md-3"><label>Mes</label><input type="number" id="mes" class="form-control" required></div>
        <div class="col-md-3"><label>Turno</label><select id="turno" class="form-select" required></select></div>
        <div class="col-md-3"><label>Prensa</label><select id="prensa" class="form-select" required></select></div>
        
        <div class="col-md-6"><label>Referencia</label><select id="referencia" class="form-select" required></select></div>
        <div class="col-md-6"><label>Material</label><select id="material" class="form-select" required></select></div>
        
        <div class="col-12"><label>Lote Bobina</label><input type="text" id="lote" class="form-control" required></div>
        
        <div class="col-6 col-md-3 text-primary"><label>Total Piezas</label><input type="number" id="total" class="form-control" required></div>
        <div class="col-6 col-md-3 text-success"><label>Buenas</label><input type="number" id="buenas" class="form-control" required></div>
        <div class="col-6 col-md-3 text-warning"><label>A Revisar</label><input type="number" id="revisar" class="form-control" required></div>
        <div class="col-6 col-md-3 text-danger"><label>Malas</label><input type="number" id="malas" class="form-control" required></div>
        
        <div class="col-12"><label>Observaciones</label><textarea id="obs" class="form-control" rows="2"></textarea></div>
        
        <div class="col-12 mt-4">
          <button type="button" class="btn btn-save w-100 p-2" id="saveBtn" onclick="saveData()">GRABAR EN EXCEL</button>
        </div>
      </div>
    </form>

    <div class="historial-container">
      <h5>Mis registros grabados</h5>
      <div class="table-responsive">
        <table class="table table-hover mt-2">
          <thead class="table-dark">
            <tr><th>Fecha</th><th>Ref</th><th>Total</th><th>Acciones</th></tr>
          </thead>
          <tbody id="listaData"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // CONFIGURACIÓN: COPIA TU URL AQUÍ ABAJO
  // ==========================================
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzP46sUeQONRX68C9DPX2_i22vdQY7NuSosVjKU-4k73i5uLvwNWvY44QVgAp3V2cUv5w/exec"; 
  // ==========================================

  let currentOperario = "";
  let cacheData = [];

  async function postToGoogle(payload) {
    try {
      const response = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    } catch (e) {
      console.error(e);
      return null;
    }
  }

  async function handleLogin() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    const b = document.getElementById("loginBtn");
    
    if(!u || !p) return;
    b.disabled = true; b.innerText = "Conectando...";

    const res = await postToGoogle({ action: "login", usuario: u, password: p });
    
    if(res && res.success) {
      currentOperario = res.user;
      document.getElementById("login-section").style.display = "none";
      document.getElementById("app-content").style.display = "block";
      document.getElementById("userTag").innerText = "Operario: " + currentOperario;
      loadConfig();
      loadHistory();
    } else {
      document.getElementById("errMsg").style.display = "block";
      b.disabled = false; b.innerText = "Iniciar Sesión";
    }
  }

  async function loadConfig() {
    const cfg = await postToGoogle({ action: "getConfig" });
    if(cfg) {
      fillSelect("turno", cfg.turnos);
      fillSelect("prensa", cfg.prensas);
      fillSelect("referencia", cfg.referencias);
      fillSelect("material", cfg.materiales);
    }
  }

  function fillSelect(id, items) {
    const s = document.getElementById(id);
    s.innerHTML = '<option value="">Seleccionar...</option>';
    items.forEach(i => s.add(new Option(i, i)));
  }

  async function saveData() {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true; btn.innerText = "Grabando en Excel...";

    const registro = {
      id: document.getElementById("rowId").value,
      operario: currentOperario,
      dia: document.getElementById("dia").value, mes: document.getElementById("mes").value,
      turno: document.getElementById("turno").value, prensa: document.getElementById("prensa").value,
      referencia: document.getElementById("referencia").value, material: document.getElementById("material").value,
      lote: document.getElementById("lote").value, total: document.getElementById("total").value,
      buenas: document.getElementById("buenas").value, revisar: document.getElementById("revisar").value,
      malas: document.getElementById("malas").value, observaciones: document.getElementById("obs").value
    };

    const res = await postToGoogle({ action: "save", registro: registro });
    if(res && res.success) {
      alert(res.message);
      document.getElementById("formProduccion").reset();
      document.getElementById("rowId").value = "";
      loadHistory();
    }
    btn.disabled = false; btn.innerText = "GRABAR EN EXCEL";
  }

  async function loadHistory() {
    const data = await postToGoogle({ action: "getRecords", operario: currentOperario });
    if(data) {
      cacheData = data;
      const t = document.getElementById("listaData");
      t.innerHTML = "";
      data.forEach(r => {
        t.innerHTML += `<tr>
          <td>${r.dia}/${r.mes}</td>
          <td>${r.referencia}</td>
          <td>${r.total}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="editRow('${r.id}')">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deleteRow('${r.id}')">🗑️</button>
          </td>
        </tr>`;
      });
    }
  }

  function editRow(id) {
    const r = cacheData.find(x => x.id === id);
    if(!r) return;
    document.getElementById("rowId").value = r.id;
    document.getElementById("dia").value = r.dia;
    document.getElementById("mes").value = r.mes;
    document.getElementById("turno").value = r.turno;
    document.getElementById("prensa").value = r.prensa;
    document.getElementById("referencia").value = r.referencia;
    document.getElementById("material").value = r.material;
    document.getElementById("lote").value = r.lote;
    document.getElementById("total").value = r.total;
    document.getElementById("buenas").value = r.buenas;
    document.getElementById("revisar").value = r.revisar;
    document.getElementById("malas").value = r.malas;
    document.getElementById("obs").value = r.observaciones;
    window.scrollTo(0,0);
  }

  async function deleteRow(id) {
    if(confirm("¿Borrar definitivamente este registro del Excel?")) {
      const res = await postToGoogle({ action: "delete", id: id });
      if(res) loadHistory();
    }
  }
</script>
</body>
</html>
