<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Planta - Cahors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .main-container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 20px;}
    
    /* ESTILOS DEL LOGO CAHORS */
    .cahors-logo { text-align: center; margin-bottom: 30px; }
    .cahors-logo h1 { color: #00509A; font-weight: 900; font-size: 3rem; letter-spacing: 4px; margin: 0; font-family: 'Arial Black', sans-serif;}
    .cahors-logo span { font-size: 0.9rem; color: #6c757d; letter-spacing: 2px; text-transform: uppercase; }

    #app-content, #admin-login-section, #admin-panel { display: none; }
    .nav-tabs { border-bottom: 2px solid #dee2e6; margin-bottom: 20px; }
    .nav-link { font-weight: bold; color: #6c757d; }
    .nav-link.active { color: #00509A !important; border-bottom: 3px solid #00509A !important; border: none; }
    .form-label { font-weight: 600; font-size: 0.85rem; color: #495057; }
    .admin-bg { background-color: #212529; color: white; border-radius: 10px; padding: 20px; }
  </style>
</head>
<body>

<div class="main-container">
  
  <div class="cahors-logo">
    <h1>CAHORS</h1>
    <span>Control de Producción</span>
  </div>

  <div id="login-section">
    <div class="text-center mb-4">
      <h4>Acceso Operarios</h4>
    </div>
    <div class="mb-3">
      <input type="text" id="user" class="form-control form-control-lg" placeholder="Usuario">
    </div>
    <div class="mb-3">
      <input type="password" id="pass" class="form-control form-control-lg" placeholder="Contraseña">
    </div>
    <button class="btn btn-primary btn-lg w-100 mb-4" onclick="handleLogin()" id="loginBtn" style="background-color: #00509A;">Entrar al Sistema</button>
    
    <div class="text-center mt-4 border-top pt-3">
      <button class="btn btn-sm btn-outline-secondary" onclick="showAdminLogin()">⚙️ Acceso Administrador</button>
    </div>
  </div>

  <div id="admin-login-section">
    <div class="text-center mb-4">
      <h4 class="text-danger">Panel de Administración</h4>
      <p class="text-muted">Gestión de la base de datos (Configuración)</p>
    </div>
    <div class="mb-3">
      <input type="password" id="adminPass" class="form-control form-control-lg" placeholder="Contraseña de Administrador">
    </div>
    <button class="btn btn-danger btn-lg w-100 mb-3" onclick="verifyAdmin()">Acceder</button>
    <button class="btn btn-link text-secondary w-100" onclick="cancelAdmin()">Volver a Operarios</button>
  </div>

  <div id="admin-panel">
    <div class="admin-bg">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="m-0">🛠️ Añadir a Configuración</h5>
        <button class="btn btn-sm btn-outline-light" onclick="location.reload()">Salir</button>
      </div>

      <div class="mb-3">
        <label class="form-label text-light">¿Qué dato quieres añadir al Excel?</label>
        <select id="configType" class="form-select" onchange="toggleAdminInputs()">
          <option value="operario">Nuevo Operario</option>
          <option value="referencia">Nueva Referencia</option>
          <option value="prensa">Nuevo Número de Prensa</option>
          <option value="material">Nuevo Tipo de Material</option>
        </select>
      </div>

      <div class="row g-2" id="admin-inputs">
        </div>

      <button class="btn btn-success w-100 mt-4" id="btnSaveConfig" onclick="saveConfig()">Añadir Dato al Excel</button>
    </div>
  </div>

  <div id="app-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <span id="userTag" class="badge fs-6 p-2" style="background-color: #00509A;"></span>
      <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">Cerrar Sesión</button>
    </div>

    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="prod-tab" data-bs-toggle="tab" data-bs-target="#prod-panel" type="button" onclick="checkDataLoss(event)">Producción</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="averia-tab" data-bs-toggle="tab" data-bs-target="#averia-panel" type="button" onclick="checkDataLoss(event)">Averías</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="prod-panel">
        <form id="formProd">
          <input type="hidden" id="rowId">
          <div class="row g-3">
            <div class="col-4 col-md-2"><label class="form-label">Día</label><input type="number" id="dia" class="form-control" onchange="markDirty()"></div>
            <div class="col-4 col-md-2"><label class="form-label">Mes</label><input type="number" id="mes" class="form-control" onchange="markDirty()"></div>
            <div class="col-4 col-md-2"><label class="form-label">Horas Trab.</label><input type="number" step="0.1" id="horas" class="form-control" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label">Turno</label><select id="turno" class="form-select" onchange="markDirty()"></select></div>
            <div class="col-6 col-md-3"><label class="form-label">Prensa</label><select id="prensa" class="form-select" onchange="markDirty()"></select></div>
            
            <div class="col-md-6"><label class="form-label">Referencia</label><select id="referencia" class="form-select" onchange="markDirty()"></select></div>
            <div class="col-md-6"><label class="form-label">Material</label><select id="material" class="form-select" onchange="markDirty()"></select></div>
            <div class="col-12"><label class="form-label">Lote Bobina</label><input type="text" id="lote" class="form-control" onchange="markDirty()"></div>
            
            <div class="col-6 col-md-3"><label class="form-label text-primary">Piezas Totales</label><input type="number" id="total" class="form-control border-primary" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label text-success">Buenas</label><input type="number" id="buenas" class="form-control" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label text-warning">A Revisar</label><input type="number" id="revisar" class="form-control" onchange="markDirty()"></div>
            <div class="col-6 col-md-3"><label class="form-label text-danger">Malas</label><input type="number" id="malas" class="form-control" onchange="markDirty()"></div>

            <div class="col-12"><label class="form-label">Observaciones</label><textarea id="obs" class="form-control" rows="1" onchange="markDirty()"></textarea></div>
            
            <div class="col-12 mt-4">
              <button type="button" class="btn btn-success btn-lg w-100 shadow-sm" onclick="saveProduccion()">GRABAR PRODUCCIÓN</button>
            </div>
          </div>
        </form>

        <div class="mt-5">
          <h6 class="text-muted">Mis últimos registros</h6>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <tbody id="listaData" style="font-size: 0.9rem;"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="averia-panel">
        <h5 class="mb-3" style="color: #00509A;">Registro de Avería / Incidencia</h5>
        <form id="formAveria">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nº de Máquina</label><select id="av-maquina" class="form-select" required></select></div>
            <div class="col-md-6"><label class="form-label">Tipo de Avería</label><select id="av-tipo" class="form-select" required></select></div>
            <div class="col-6 col-md-6"><label class="form-label">Hora de Paro</label><input type="time" id="av-paro" class="form-control" required></div>
            <div class="col-6 col-md-6"><label class="form-label">Hora de Arranque</label><input type="time" id="av-arranque" class="form-control"></div>
            <div class="col-12"><label class="form-label">Observaciones</label><textarea id="av-obs" class="form-control" rows="3"></textarea></div>
            <div class="col-12 mt-4"><button type="button" class="btn btn-warning btn-lg w-100" onclick="saveAveria()">REGISTRAR AVERÍA</button></div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ==========================================
  // CONFIGURACIÓN: COPIA TU URL AQUÍ
  // ==========================================
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyt9vtd9hNfLzL4ZN66NEZZqdbbTKftT0TC4lyrOVJeuYW0XsIZRD6dbA8NTU-mDZEY2w/exec"; 
  
  // CONTRASEÑA MODO ADMINISTRADOR
  const ADMIN_PASSWORD = "admin1234";
  
  let currentOperario = "";
  let isDirty = false;

  function markDirty() { isDirty = true; }

  function checkDataLoss(e) {
    if (isDirty) {
      if (!confirm("Tienes datos sin guardar en producción. ¿Quieres cambiar de pestaña de todas formas?")) {
        e.preventDefault(); e.stopPropagation(); return false;
      }
      isDirty = false;
    }
  }

  async function callAPI(action, data = {}) {
    try {
      const response = await fetch(WEB_APP_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...data })
      });
      return await response.json();
    } catch (e) {
      alert("Error de conexión."); return null;
    }
  }

  // --- LÓGICA DE ADMINISTRADOR ---
  function showAdminLogin() {
    document.getElementById("login-section").style.display = "none";
    document.getElementById("admin-login-section").style.display = "block";
  }

  function cancelAdmin() {
    document.getElementById("admin-login-section").style.display = "none";
    document.getElementById("login-section").style.display = "block";
    document.getElementById("adminPass").value = "";
  }

  function verifyAdmin() {
    if(document.getElementById("adminPass").value === ADMIN_PASSWORD) {
      document.getElementById("admin-login-section").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      toggleAdminInputs(); // Carga los inputs iniciales
    } else {
      alert("Contraseña de administrador incorrecta");
    }
  }

  function toggleAdminInputs() {
    const tipo = document.getElementById("configType").value;
    const container = document.getElementById("admin-inputs");
    container.innerHTML = "";

    if (tipo === "operario") {
      container.innerHTML = `
        <div class="col-6"><input type="text" id="cfgVal1" class="form-control" placeholder="Nombre de Usuario"></div>
        <div class="col-6"><input type="text" id="cfgVal2" class="form-control" placeholder="Contraseña"></div>
      `;
    } else {
      let placeholder = tipo === "referencia" ? "Ej: REF-1234" : (tipo === "prensa" ? "Ej: Prensa 5" : "Ej: PVC");
      container.innerHTML = `<div class="col-12"><input type="text" id="cfgVal1" class="form-control" placeholder="${placeholder}"></div>`;
    }
  }

  async function saveConfig() {
    const tipo = document.getElementById("configType").value;
    const val1 = document.getElementById("cfgVal1") ? document.getElementById("cfgVal1").value : "";
    const val2 = document.getElementById("cfgVal2") ? document.getElementById("cfgVal2").value : "";

    if (!val1) return alert("El campo no puede estar vacío.");

    const btn = document.getElementById("btnSaveConfig");
    btn.disabled = true; btn.innerText = "Guardando...";

    const res = await callAPI("saveConfig", { registro: { tipo: tipo, val1: val1, val2: val2 } });
    
    if (res && res.success) {
      alert(res.message);
      document.getElementById("cfgVal1").value = "";
      if(document.getElementById("cfgVal2")) document.getElementById("cfgVal2").value = "";
    }
    btn.disabled = false; btn.innerText = "Añadir Dato al Excel";
  }


  // --- LÓGICA DE OPERARIOS (IGUAL QUE ANTES) ---
  async function handleLogin() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    const btn = document.getElementById("loginBtn");

    if(!u || !p) return alert("Escribe usuario y contraseña");
    btn.disabled = true; btn.innerText = "Verificando...";

    const res = await callAPI("login", { usuario: u, password: p });
    if (res && res.success) {
      currentOperario = res.user;
      document.getElementById("login-section").style.display = "none";
      document.getElementById("app-content").style.display = "block";
      document.getElementById("userTag").innerText = "👤 " + currentOperario;
      
      const hoy = new Date();
      document.getElementById("dia").value = hoy.getDate();
      document.getElementById("mes").value = hoy.getMonth() + 1;

      loadConfig(); loadHistory();
    } else {
      alert("Usuario o contraseña incorrectos");
      btn.disabled = false; btn.innerText = "Entrar al Sistema";
    }
  }

  async function loadConfig() {
    const cfg = await callAPI("getConfig");
    if(cfg) {
      fillSelect("turno", cfg.turnos); fillSelect("prensa", cfg.prensas);
      fillSelect("av-maquina", cfg.prensas); fillSelect("referencia", cfg.referencias);
      fillSelect("material", cfg.materiales); fillSelect("av-tipo", cfg.averias);
    }
  }

  function fillSelect(id, list) {
    const s = document.getElementById(id);
    s.innerHTML = '<option value="">Seleccionar...</option>';
    list.forEach(i => s.add(new Option(i, i)));
  }

  async function saveProduccion() {
    const t = parseInt(document.getElementById("total").value) || 0;
    const b = parseInt(document.getElementById("buenas").value) || 0;
    const r = parseInt(document.getElementById("revisar").value) || 0;
    const m = parseInt(document.getElementById("malas").value) || 0;

    if (t !== (b + r + m)) return alert(`⚠️ ERROR DE SUMA:\nEl Total (${t}) debe ser igual a la suma de Buenas+Revisar+Malas (${b+r+m}).`);

    const registro = {
      id: document.getElementById("rowId").value, operario: currentOperario,
      dia: document.getElementById("dia").value, mes: document.getElementById("mes").value,
      horas: document.getElementById("horas").value, turno: document.getElementById("turno").value, 
      prensa: document.getElementById("prensa").value, referencia: document.getElementById("referencia").value, 
      material: document.getElementById("material").value, lote: document.getElementById("lote").value, 
      total: t, buenas: b, revisar: r, malas: m, observaciones: document.getElementById("obs").value
    };

    const res = await callAPI("save", { registro });
    if (res && res.success) {
      alert(res.message);
      document.getElementById("formProd").reset();
      document.getElementById("rowId").value = "";
      const hoy = new Date();
      document.getElementById("dia").value = hoy.getDate(); document.getElementById("mes").value = hoy.getMonth() + 1;
      isDirty = false; loadHistory();
    }
  }

  async function saveAveria() {
    const registro = {
      operario: currentOperario, maquina: document.getElementById("av-maquina").value,
      tipo: document.getElementById("av-tipo").value, paro: document.getElementById("av-paro").value,
      arranque: document.getElementById("av-arranque").value, observaciones: document.getElementById("av-obs").value
    };

    if (!registro.maquina || !registro.tipo || !registro.paro) return alert("Faltan campos obligatorios.");

    const res = await callAPI("saveAveria", { registro });
    if (res && res.success) { alert(res.message); document.getElementById("formAveria").reset(); }
  }

  async function loadHistory() {
    const data = await callAPI("getRecords", { operario: currentOperario });
    if(data) {
      const tbody = document.getElementById("listaData");
      tbody.innerHTML = "";
      data.forEach(r => {
        tbody.innerHTML += `<tr><td><strong>${r.dia}/${r.mes}</strong></td><td>${r.referencia}</td><td class="text-end text-primary fw-bold">${r.total} u.</td></tr>`;
      });
    }
  }
</script>
</body>
</html>
